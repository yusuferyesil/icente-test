<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICENTE 2026 - Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900 font-sans pt-16">

  <!-- Header -->
  <div id="header-placeholder"></div>
  <div id="announcement-placeholder"></div>

  <main class="py-10 px-4 max-w-4xl mx-auto space-y-20" data-aos="fade-up">
    <section>
      <h1 class="text-4xl font-extrabold text-yellow-600 text-center mb-10 tracking-tight">Contact Us</h1>
      <p class="text-lg text-gray-600 text-center leading-relaxed mb-6">
        For questions and inquiries, please contact: <a href="mailto:icente@selcuk.edu.tr" class="text-yellow-600 underline">icente@selcuk.edu.tr</a>
      </p>
    </section>

    <section class="bg-white p-8 rounded shadow border border-gray-200" data-aos="zoom-in">
      <h2 class="text-2xl font-semibold text-yellow-600 mb-4">Get in Touch</h2>
      <p class="text-gray-600 mb-6 leading-relaxed">
        If you have any questions regarding paper submissions, registration, or the conference program, please reach out to us directly via e-mail. We aim to respond within 2–3 business days.
      </p>
      <div class="flex items-center gap-4 bg-yellow-50 border border-yellow-200 rounded-lg px-6 py-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5a2.25 2.25 0 0 0-2.25 2.25m19.5 0-9.75 6.75L2.25 6.75" />
        </svg>
        <a href="mailto:icente@selcuk.edu.tr" class="text-yellow-700 font-semibold text-lg hover:underline">icente@selcuk.edu.tr</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder" class="mt-16"></div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init();</script>
  <script src="js/main.js"></script>
</body>
</html>
