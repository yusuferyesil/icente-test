<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICENTE 2026 - Program</title>

  <!-- TailwindCSS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/main.css" />


</head>

<body class="bg-gray-100 text-gray-800 font-sans pt-16">

  <!-- Header -->
  <div id="header-placeholder"></div>
  <div id="announcement-placeholder"></div>

  <main class="py-20 px-4 max-w-4xl mx-auto">

    <section data-aos="fade-up" class="text-center">
      <h1 class="text-4xl font-bold text-yellow-600 mb-12">Conference Program</h1>

      <!-- Coming Soon Box -->
      <div class="bg-white border border-yellow-200 rounded-2xl shadow-lg p-12 flex flex-col items-center gap-6">

        <!-- Icon -->
        <div class="w-20 h-20 rounded-full bg-yellow-50 flex items-center justify-center ring-4 ring-yellow-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
          </svg>
        </div>

        <div>
          <h2 class="text-2xl font-bold text-gray-800 mb-3">To Be Announced</h2>
          <p class="text-gray-500 text-lg leading-relaxed max-w-xl mx-auto">
            The conference program for <span class="font-semibold text-yellow-600">ICENTE 2026</span> will be published soon.
            Please check back later for the full schedule of sessions and presentations.
          </p>
        </div>

        <div class="mt-2 inline-flex items-center gap-2 bg-yellow-50 border border-yellow-200 text-yellow-700 text-sm font-medium px-5 py-2.5 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          Coming Soon
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer-placeholder" class="mt-16"></div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="js/main.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });
  </script>

</body>
</html>
